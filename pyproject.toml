[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "routine-sweeper"
version = "0.1.0"
description = "Unattended cleanup of Claude Code routine (scheduled task) run sessions: batch-prune old runs by policy, with dry-run preview and whitelist protection"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
keywords = ["claude-code", "scheduled-tasks", "routines", "session-management", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
routine-sweeper = "routine_sweeper.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/routine-sweeper"

[tool.setuptools.packages.find]
where = ["src"]
